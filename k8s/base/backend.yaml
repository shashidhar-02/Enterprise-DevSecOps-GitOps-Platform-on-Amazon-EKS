apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backend
          image: ghcr.io/shashidhar-02/enterprise-devsecops-gitops-platform-on-amazon-eks/cravedrop-backend:bootstrap
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 5000}]
          envFrom:
            - configMapRef: {name: backend-config}
            - secretRef: {name: backend-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: database-ca, mountPath: /var/run/db-ca, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: database-ca
          configMap: {name: database-ca}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: backend}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: backend}
  ports: [{name: http, port: 5000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: backend}
