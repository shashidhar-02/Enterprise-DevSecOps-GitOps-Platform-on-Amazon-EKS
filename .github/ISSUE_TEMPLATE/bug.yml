name: Bug report
description: Report a reproducible application or platform defect
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: Describe the observed behavior and expected result.}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Include steps and the affected commit/version.}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Environment, description: Include relevant tool versions and sanitized logs. Do not include secrets.}
