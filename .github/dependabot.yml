version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /frontend
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /terraform
    schedule: {interval: weekly}
  - package-ecosystem: gomod
    directory: /tools
    schedule: {interval: weekly}
