name: Platform Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Application (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=moderate
      - if: matrix.component == 'frontend'
        run: npm run build
  integration:
    name: PostgreSQL and WebSocket integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cravedrop_test
          POSTGRES_USER: cravedrop_test
          POSTGRES_PASSWORD: ephemeral-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U cravedrop_test -d cravedrop_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: cravedrop_test
      DB_NAME: cravedrop_test
      DB_PASSWORD: ephemeral-test-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --prefix backend
      - run: npm --prefix backend run test:integration
  containers:
    name: Container security (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: warning
      - run: docker build -t cravedrop-${{ matrix.component }}:ci ./${{ matrix.component }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cravedrop-${{ matrix.component }}:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          timeout: 10m
  configuration:
    name: Terraform, GitOps and workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.13.4'
      - run: terraform fmt -check -recursive terraform/
      - run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: v1.35.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache-dependency-path: tools/go.sum
      - name: Build locked validators
        working-directory: tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -mod=readonly -o "$RUNNER_TEMP/bin/actionlint" github.com/rhysd/actionlint/cmd/actionlint
          go build -mod=readonly -o "$RUNNER_TEMP/bin/kubeconform" github.com/yannh/kubeconform/cmd/kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: actionlint
      - run: shellcheck deploy/setup.sh
      - name: Strict Kubernetes and Argo CD schemas
        run: |
          for environment in dev prod; do
            kubectl kustomize "k8s/overlays/$environment" | kubeconform -strict -summary -kubernetes-version 1.35.0
          done
          kubeconform -strict -summary -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/d373c2da9702bc9509a004db83e57263fe3bdfc1/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' gitops/
  source-security:
    name: IaC and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '1'
          skip-dirs: node_modules,.terraform
  browser:
    name: Containerized browser checkout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate disposable credentials
        run: |
          password="$(openssl rand -hex 24)"
          session="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$session"
          echo "DB_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$session" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: docker compose exec -T -e ALLOW_DEMO_SEED=true backend node seed.js
      - run: npm ci --ignore-scripts --prefix frontend
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
  publish:
    name: Publish (${{ matrix.component }})
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && vars.PUBLISH_REVIEW_IMAGES == 'true' &&
      github.actor == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository)
    needs: [application, integration, containers, configuration, source-security, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repository
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ghcr.io/${{ steps.repository.outputs.name }}/cravedrop-${{ matrix.component }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record release digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: echo "$COMPONENT image digest - $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
